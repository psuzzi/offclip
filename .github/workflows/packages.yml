name: packages
# Builds and install-tests offclip-<ver>.deb, offclip-<ver>.rpm and offclip-setup.exe.
# Runs by itself on manual dispatch and when the packaging files change; release.yml calls it for every tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (default: newest tag)"
        required: false
  workflow_call:
    inputs:
      tag:
        description: "Tag to build"
        type: string
        required: true
  push:
    branches: [main]
    paths:
      - scripts/build-linux-packages.sh
      - scripts/build-windows-installer.ps1
      - installer/**
      - .github/workflows/packages.yml
      - assets/**

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm desktop-file-utils
      - name: pick ref
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.sha }}"; else TAG="$(git describe --tags --abbrev=0)"; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "building $TAG"
      - name: build .deb and .rpm
        run: scripts/build-linux-packages.sh "${{ steps.tag.outputs.tag }}"
      - name: inspect
        run: |
          ls -la dist
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | awk '{print $1, $NF}'
          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm
          dpkg-deb --fsys-tarfile dist/*.deb | tar -xO ./usr/share/applications/offclip.desktop > /tmp/offclip.desktop
          desktop-file-validate /tmp/offclip.desktop
      - name: install and run on Ubuntu 24.04
        run: |
          docker run --rm -v "$PWD/dist:/dist" -e OFFCLIP_NO_SPLASH=1 ubuntu:24.04 bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            apt-get install -y -q /dist/offclip-*.deb xvfb
            offclip --version
            xvfb-run -a offclip --selftest
            ls ~/.local/share/offclip'
      - name: install and run on Fedora 41
        run: |
          docker run --rm -v "$PWD/dist:/dist" -e OFFCLIP_NO_SPLASH=1 fedora:41 bash -euxc '
            dnf install -y -q /dist/offclip-*.rpm xorg-x11-server-Xvfb
            offclip --version
            xvfb-run -a offclip --selftest
            ls ~/.local/share/offclip'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: pick ref
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.sha }}"; else TAG="$(git describe --tags --abbrev=0)"; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "building $TAG"
      - name: build offclip-setup.exe
        shell: pwsh
        run: scripts/build-windows-installer.ps1 -Ref "${{ steps.tag.outputs.tag }}"
      - name: silent install, run, uninstall
        shell: pwsh
        env:
          CI: "true"
        run: |
          $p = Start-Process -FilePath "dist\offclip-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART","/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log | Select-Object -Last 30; throw "installer exit code $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\offclip"
          Get-ChildItem $app
          if (-not (Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\offclip\offclip.lnk"))) { throw "Start menu shortcut missing" }
          cmd /c "`"$app\run.bat`" --version"
          if ($LASTEXITCODE -ne 0) { throw "run.bat --version failed" }
          cmd /c "`"$app\run.bat`" --selftest"
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
          $u = Start-Process -FilePath (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exit code $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $app) { Get-ChildItem $app -Recurse | Select-Object FullName; throw "app folder still present after uninstall" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "offclip")) { throw "data folder still present after uninstall" }
          Write-Host "install / run / uninstall OK"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/offclip-setup.exe
